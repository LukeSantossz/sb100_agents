name: Docker Build

# Validates that the multi-stage Dockerfile builds in CI and that the final
# image does not contain build-essential. Triggers only on relevant changes
# to reduce cost.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.api"
      - "docker-compose.yml"
      - ".dockerignore"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile.api"
      - "docker-compose.yml"
      - ".dockerignore"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/docker-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (multi-stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          load: true
          tags: smartb100_api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert build-essential is NOT in runtime image
        run: |
          # build-essential appears in the builder stage but must not appear in the final runtime.
          # docker history shows the layers; the full output exposes apt-get install steps.
          if docker history --no-trunc smartb100_api:ci | grep -q "build-essential"; then
            echo "ERROR: build-essential found in final image — multi-stage broken"
            docker history --no-trunc smartb100_api:ci | head -30
            exit 1
          fi
          echo "OK: build-essential not present in runtime layers"

      - name: Assert curl IS in runtime image (needed for healthchecks)
        run: |
          # curl must be installed for the docker-compose healthchecks to work.
          docker run --rm --entrypoint sh smartb100_api:ci -c "command -v curl"

      - name: Validate compose configuration
        env:
          # docker-compose.yml now requires JWT_SECRET_KEY via the fail-fast
          # ${VAR:?} form; a throwaway value satisfies interpolation for this
          # syntax-only check (no container is started).
          JWT_SECRET_KEY: ci-compose-config-validation-dummy-32-chars
        run: |
          docker compose --profile infra --profile app config > /dev/null
          echo "OK: docker-compose.yml is syntactically valid"

      - name: Show image size summary
        run: |
          docker images smartb100_api:ci --format "{{.Repository}}:{{.Tag}} {{.Size}}"
