name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: an unpinned tool turns CI red on a tree nobody touched, and a
      # version bump should be a commit somebody made.
      - name: Install ruff
        run: pip install ruff==0.16.4

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The project is installed, not just mypy. Without the dependencies every
      # third-party import resolves to Any, and strict mode reasons differently
      # about Any than about a real type, so the job would be checking a
      # different program than the one a contributor checks locally.
      - name: Install dependencies
        run: |
          pip install -e .
          pip install mypy==2.3.1 types-requests==2.33.0.20260712

      # Every package pyproject.toml declares strict, not a subset. Checking
      # three of seven left the other four passing strict only by accident.
      - name: Run mypy on every package declared strict
        run: |
          mypy agent/ api/ core/ retrieval/ generation/ memory/ verification/ \
            --ignore-missing-imports \
            --no-error-summary
        env:
          PYTHONPATH: ${{ github.workspace }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest==9.1.1 pytest-cov==7.1.0 httpx==0.28.1

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -m "not requires_infra"
        env:
          QDRANT_URL: "http://localhost:6333"
          CHAT_MODEL: "llama3.2:3b"
          EMBED_MODEL: "nomic-embed-text"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
