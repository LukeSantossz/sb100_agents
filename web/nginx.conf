# Serves the built app and proxies /api to the API, so the page and the API share
# one origin and the browser makes no cross-origin call.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. With the upstream in a variable, nginx resolves "api"
    # per request instead of once at startup, so a recreated api container (new IP)
    # is found again, and nginx starts even before the api name resolves.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        # A variable proxy_pass forwards the URI unchanged, so strip the prefix
        # here: /api/chat reaches /chat.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The page gives up after CHAT_TIMEOUT, at most 3600 s (core/config.py).
        # The proxy must outwait it, or nginx answers 504 before the page decides.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
