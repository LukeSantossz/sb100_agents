services:
  # ============================================================================
  # Profile: infra - Infrastructure services (Qdrant)
  # Usage: docker compose --profile infra up -d
  # Note: Ollama runs locally (not via Docker). See README.md / SETUP.md.
  # ============================================================================

  qdrant:
    image: qdrant/qdrant:latest
    container_name: smartb100_qdrant
    profiles: ["infra"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Named volume (native ext4 in the WSL2 VM), NOT a host bind mount: a Windows-path
      # bind mount is exposed to the container as FUSE/virtiofs, which stalls Qdrant's
      # mmap/fsync I/O and wedges vector search and shutdown (worse under OneDrive sync).
      # See docs/adr/0014.
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - smartb100_net
    healthcheck:
      # Qdrant exposes its version at / with status 200 when healthy.
      # The official image has no curl; /proc/net/tcp is a cheap liveness probe.
      test: ["CMD-SHELL", "grep -q ':18BD' /proc/net/tcp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Profile: app - Application services (API + Gradio UI)
  # Usage: docker compose --profile infra --profile app up -d
  # OLLAMA_HOST override: native Linux uses http://172.17.0.1:11434 or host-net.
  # ============================================================================

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: smartb100_api
    profiles: ["app"]
    ports:
      - "8000:8000"
    # Everything the operator tuned. Compose reads this from the host at up time,
    # so .dockerignore is irrelevant and no secret enters the image. Before this
    # existed only the explicit list below reached the container, and every other
    # Settings field silently fell back to its class default: verification scored a
    # constant 0.5, OLLAMA_TIMEOUT stayed at 240 whatever .env said, and
    # AGENT_ENABLED could not be turned on at all.
    #
    # required: false because .env is gitignored, so a clean clone has none and
    # compose must not refuse to start over a file the repository never ships.
    env_file:
      - path: .env
        required: false
    # Not operator settings, so they are not left to .env. `environment` wins over
    # `env_file`, which is what makes these three authoritative:
    #   QDRANT_URL   - inside the container Qdrant is a service name, not localhost.
    #   OLLAMA_HOST  - keeps the inline override documented in SETUP 9.1 working.
    #   JWT_SECRET_KEY - must fail loudly rather than default.
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in the host environment or .env}
      # Inside the mounted directory, not at the image root. See the volume below.
      - SMARTB100_DB_PATH=/app/data/smartb100_v2.db
    volumes:
      # A directory, not the database file. Bind-mounting ./smartb100_v2.db made
      # Docker create a directory with that name on every clean clone, because the
      # file is gitignored and therefore always absent, and the API then refused to
      # start until the operator created it by hand. Docker creating ./data is
      # correct, and SQLite creates the file inside it on first boot.
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - smartb100_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gradio:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: smartb100_gradio
    profiles: ["app"]
    ports:
      - "7860:7860"
    # Same reasoning as the api service. The UI reads CHAT_TIMEOUT from Settings,
    # so without this its timeout was pinned to the class default too.
    env_file:
      - path: .env
        required: false
    environment:
      - API_URL=http://api:8000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in the host environment or .env}
    command: ["python", "ui/chat_ui.py", "--api-url", "http://api:8000", "--port", "7860"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - smartb100_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  smartb100_net:
    driver: bridge

volumes:
  qdrant_storage:
